[profile.default]
src = "src"
out = "out"
libs = ["lib"]
network = "monad"          # Monad EVM rules (Foundry >= 1.8). Default hardfork: MonadTen

# Monad testnet chain id (docs.monad.xyz/developer-essentials/testnet).
# NOTE: do NOT set eth-rpc-url here. In Monad mode forge then calls the public RPC during
# tests (measured: slow runs and HTTP 429 rate-limit failures). Pass --rpc-url when deploying.
chain_id = 10143

[fmt]
line_length = 100

[fuzz]
runs = 256
