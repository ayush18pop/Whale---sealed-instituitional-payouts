<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -6 1650.0 861" width="1650.0" height="861"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#18181B"/></marker></defs><rect x="-1000" y="-1000" width="5000" height="5000" fill="#fff"/><text x="60" y="87.0" font-size="60" fill="#18181B" text-anchor="start" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">Whale</text><text x="60" y="125.3" font-size="26" fill="#52525B" text-anchor="start" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">How a payout travels from the browser to Monad</text><rect x="30" y="230" width="270" height="250" rx="18" fill="#FFFFFF" stroke="#18181B" stroke-width="3"/><text x="165.0" y="277.5" font-size="30" fill="#18181B" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">Browser</text><text x="165.0" y="313.55" font-size="21" fill="#3F3F46" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">Signs the payout,</text><text x="165.0" y="339.8" font-size="21" fill="#3F3F46" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">then encrypts it to</text><text x="165.0" y="366.05" font-size="21" fill="#3F3F46" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">the operator&#x27;s key</text><text x="165.0" y="441.1" font-size="22" fill="#1D4ED8" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">0x04a1c9...e7e1</text><text x="165.0" y="463.85" font-size="17" fill="#71717A" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">(ciphertext)</text><rect x="430" y="190.0" width="340" height="330" rx="18" fill="#FFFFFF" stroke="#18181B" stroke-width="3"/><text x="600.0" y="237.5" font-size="30" fill="#18181B" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">Trusted relay</text><text x="600.0" y="273.55" font-size="21" fill="#3F3F46" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">Queues the encrypted txs</text><text x="600.0" y="299.8" font-size="21" fill="#3F3F46" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">in the order they arrive</text><rect x="456" y="328.0" width="288" height="168" rx="18" fill="#F4F4F5" stroke="#52525B" stroke-width="2"/><text x="474" y="361.1" font-size="22" fill="#18181B" text-anchor="start" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">#1  0x9f3a...c1d2</text><text x="474" y="388.6" font-size="22" fill="#18181B" text-anchor="start" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">#2  0x41be...07a9</text><text x="474" y="416.1" font-size="22" fill="#18181B" text-anchor="start" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">#3  0xd2c8...5e44</text><text x="474" y="443.6" font-size="22" fill="#18181B" text-anchor="start" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">      ...</text><text x="474" y="471.1" font-size="22" fill="#18181B" text-anchor="start" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">#n  0x7b10...e9f3</text><rect x="900" y="230" width="280" height="250" rx="18" fill="#FFFFFF" stroke="#18181B" stroke-width="3"/><text x="1040.0" y="277.5" font-size="30" fill="#18181B" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">Tx builder</text><text x="1040.0" y="313.55" font-size="21" fill="#3F3F46" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">Wraps each one in</text><text x="1040.0" y="339.8" font-size="21" fill="#3F3F46" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">Hub.submit(), signs it</text><text x="1040.0" y="366.05" font-size="21" fill="#3F3F46" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">with our backend key,</text><text x="1040.0" y="392.3" font-size="21" fill="#3F3F46" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">pays the gas</text><rect x="1310" y="230" width="280" height="250" rx="18" fill="#EFF4FF" stroke="#1D4ED8" stroke-width="3"/><text x="1450.0" y="277.5" font-size="30" fill="#1D4ED8" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">Monad</text><text x="1450.0" y="313.55" font-size="21" fill="#3F3F46" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">The Hub logs the bytes.</text><text x="1450.0" y="339.8" font-size="21" fill="#3F3F46" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">Block order is the</text><text x="1450.0" y="366.05" font-size="21" fill="#3F3F46" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">final order. The public</text><text x="1450.0" y="392.3" font-size="21" fill="#3F3F46" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">sees only ciphertext.</text><polyline points="306,355 424,355" fill="none" stroke="#18181B" stroke-width="4" marker-end="url(#a)"/><ellipse cx="365.0" cy="355.0" rx="25.0" ry="25.0" fill="#1D4ED8" stroke="#1D4ED8" stroke-width="2"/><text x="365.0" y="368.6" font-size="32" fill="#FFFFFF" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">1</text><text x="365.0" y="298.0" font-size="20" fill="#1D4ED8" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">ciphertext</text><polyline points="776,355 894,355" fill="none" stroke="#18181B" stroke-width="4" marker-end="url(#a)"/><ellipse cx="835.0" cy="355.0" rx="25.0" ry="25.0" fill="#1D4ED8" stroke="#1D4ED8" stroke-width="2"/><text x="835.0" y="368.6" font-size="32" fill="#FFFFFF" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">2</text><text x="835.0" y="298.0" font-size="20" fill="#1D4ED8" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">same order</text><polyline points="1186,355 1304,355" fill="none" stroke="#18181B" stroke-width="4" marker-end="url(#a)"/><ellipse cx="1245.0" cy="355.0" rx="25.0" ry="25.0" fill="#1D4ED8" stroke="#1D4ED8" stroke-width="2"/><text x="1245.0" y="368.6" font-size="32" fill="#FFFFFF" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">3</text><text x="1245.0" y="298.0" font-size="20" fill="#1D4ED8" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">signed tx</text><rect x="1310" y="610" width="280" height="215" rx="18" fill="#F4F4F5" stroke="#52525B" stroke-width="3"/><text x="1450.0" y="657.5" font-size="30" fill="#3F3F46" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">Operator</text><text x="1450.0" y="693.55" font-size="21" fill="#3F3F46" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">Decrypts, runs it</text><text x="1450.0" y="719.8" font-size="21" fill="#3F3F46" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">privately, posts a</text><text x="1450.0" y="746.05" font-size="21" fill="#3F3F46" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">receipt to Monad</text><polyline points="1405.0,488 1405.0,602" fill="none" stroke="#18181B" stroke-width="4" marker-end="url(#a)"/><polyline points="1495.0,602 1495.0,488" fill="none" stroke="#71717A" stroke-width="3" marker-end="url(#a)"/><ellipse cx="1405.0" cy="545.0" rx="25.0" ry="25.0" fill="#1D4ED8" stroke="#1D4ED8" stroke-width="2"/><text x="1405.0" y="558.6" font-size="32" fill="#FFFFFF" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">4</text><text x="1390.0" y="520.95" font-size="19" fill="#18181B" text-anchor="end" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">events</text><text x="1510.0" y="550.95" font-size="19" fill="#71717A" text-anchor="start" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">receipt</text><text x="60" y="667.3" font-size="26" fill="#3F3F46" text-anchor="start" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">Each employee sees only their own pay.</text><text x="60" y="699.8" font-size="26" fill="#3F3F46" text-anchor="start" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">An auditor sees what the company allows.</text><text x="60" y="756.0" font-size="20" fill="#71717A" text-anchor="start" font-family="Helvetica,Arial,sans-serif" xml:space="preserve">Demo note: the operator is run by us. Hardware privacy is the paper&#x27;s next step.</text></svg>